name: Build portfolio preview
on:
  push:
    branches: ["preview/react-multipage-field-notes"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
