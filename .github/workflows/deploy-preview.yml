name: Build and deploy portfolio
on:
  push:
    branches: ["preview/react-multipage-field-notes", "main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload preview build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Publish built site to GitHub Pages branch root
        if: github.ref == 'refs/heads/main'
        run: |
          cp -R dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "No published site changes."
          else
            git commit -m "Deploy portfolio site"
            git push
          fi
